  <rect width="500" height="500" fill="#0A0A0B" rx="4"></rect>

  
  <rect x="10" y="10" width="480" height="480" fill="none" stroke="url(#gold)" stroke-width="3.5" rx="2"></rect>
  <rect x="17" y="17" width="466" height="466" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.45" rx="1"></rect>

  
  <text x="192" y="90" text-anchor="middle" font-family="&#39;Abril Fatface&#39;, serif" font-size="62" fill="url(#gold)">Top Notch</text>

  
  <rect x="384" y="100" width="52" height="14" rx="1" fill="url(#gold)"></rect>
  
  <polygon points="384,114 436,114 420,208 400,208" fill="url(#gold)"></polygon>
  
  <polygon points="400,208 420,208 410,224" fill="url(#gold)"></polygon>

  
  <text x="34" y="218" text-anchor="start" font-family="&#39;Anton&#39;, sans-serif" font-size="124" fill="url(#gold)">TNDS</text>

  
  <rect x="34" y="230" width="440" height="2.5" fill="url(#gold)"></rect>

  
  <polygon points="410,216 412,224 420,220 416,228 425,230 416,232 420,240 412,236 410,244 408,236 400,240 404,232 395,230 404,228 400,220 408,224" fill="url(#gold)"></polygon>

  
  <text x="250" y="267" text-anchor="middle" font-family="&#39;Oswald&#39;, sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="url(#gold)">LASER ENGRAVING</text>

  
  <text x="250" y="293" text-anchor="middle" font-family="&#39;Oswald&#39;, sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="url(#gold)">AND CRAFTS</text>

  
  <text x="250" y="400" text-anchor="middle" font-family="&#39;Playfair Display&#39;, serif" font-weight="800" font-style="italic" font-size="68" fill="url(#gold)">Design Studio</text>

  
  <rect width="500" height="500" fill="url(#shimmer)" mask="url(#logoMask)"></rect>
